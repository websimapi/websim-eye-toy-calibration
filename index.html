<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Toy Calibration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Webcam Video -->
        <video id="webcam" autoplay muted playsinline></video>
        
        <!-- Calibration Overlay -->
        <div class="calibration-overlay">
            <div class="header">
                <h1 class="title">EYE TOY</h1>
                <p class="subtitle">Motion Gaming System</p>
            </div>
            
            <div class="calibration-content">
                <div class="status-panel">
                    <h2 id="status-title">Camera Calibration</h2>
                    <p id="status-message">Position yourself in the center of the frame</p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>
                
                <div class="body-outline">
                    <div class="silhouette">
                        <div class="head"></div>
                        <div class="torso"></div>
                        <div class="arms">
                            <div class="arm left"></div>
                            <div class="arm right"></div>
                        </div>
                        <div class="legs">
                            <div class="leg left"></div>
                            <div class="leg right"></div>
                        </div>
                    </div>
                </div>
                
                <div class="instructions">
                    <p>Stand in the outlined area and move around to calibrate</p>
                    <div class="controls">
                        <button id="start-btn" class="primary-btn">Start Calibration</button>
                        <button id="continue-btn" class="secondary-btn" style="display: none;">Continue</button>
                    </div>
                </div>
            </div>
            
            <div class="corner-frames">
                <div class="frame top-left"></div>
                <div class="frame top-right"></div>
                <div class="frame bottom-left"></div>
                <div class="frame bottom-right"></div>
            </div>
        </div>
        
        <!-- Permission Prompt -->
        <div class="permission-prompt" id="permission-prompt">
            <div class="prompt-content">
                <h2>Camera Access Required</h2>
                <p>Eye Toy needs access to your camera to detect your movements</p>
                <button id="grant-permission" class="primary-btn">Allow Camera Access</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
