<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Toy - Body Tracking</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
          "imports": {
            "@mediapipe/pose": "https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js",
            "@mediapipe/drawing_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675469404/drawing_utils.js",
            "@mediapipe/camera_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675469404/camera_utils.js"
          }
        }
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Webcam Video -->
        <video id="webcam" autoplay muted playsinline></video>
        <!-- Canvas for Pose Overlay -->
        <canvas id="pose-canvas"></canvas>
        
        <!-- Permission Prompt -->
        <div class="permission-prompt" id="permission-prompt">
            <div class="prompt-content">
                <h2>Camera Access Required</h2>
                <p>Eye Toy needs access to your camera to detect your movements</p>
                <button id="grant-permission" class="primary-btn">Allow Camera Access</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
